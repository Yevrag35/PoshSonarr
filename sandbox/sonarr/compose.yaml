name: poshsonarr-sandbox

services:
  sonarr:
    build:
      context: .
      args:
        SONARR_VERSION: "5.0.0.2941"
        SONARR_BRANCH: "develop"
        SONARR_SHA256: "07ffb7bc6ae2f55892984785a4051bc123fa96479a01c5d96f0836bb79c3ba59"
    platform: linux/amd64
    restart: "no"
    depends_on:
      - skyhook
    environment:
      SONARR__AUTH__APIKEY: "0123456789abcdef0123456789abcdef"
      SONARR__AUTH__METHOD: "External"
      SONARR__APP__INSTANCENAME: "Sonarr Sandbox"
      SONARR__LOG__ANALYTICSENABLED: "false"
    ports:
      - "127.0.0.1:${SONARR_SANDBOX_PORT:-18989}:8989"
    volumes:
      - config:/config
      - tv:/tv
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"X-Api-Key: $$SONARR__AUTH__APIKEY\" http://127.0.0.1:8989/api/v3/system/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s

  skyhook:
    build:
      context: ./skyhook
    restart: "no"
    networks:
      default:
        aliases:
          - skyhook.sonarr.tv

volumes:
  config:
  tv:
