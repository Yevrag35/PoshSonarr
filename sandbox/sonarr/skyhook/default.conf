server {
	listen 443 ssl;
	server_name skyhook.sonarr.tv;

	ssl_certificate /etc/nginx/tls/cert.pem;
	ssl_certificate_key /etc/nginx/tls/key.pem;

	root /usr/share/nginx/html;
	default_type application/json;

	# Sonarr's HTTP client throws on an HTML response before it looks at the status, so nginx's own
	# 404 page would turn a show that isn't here into a 500. A JSON 404 is what Sonarr reports as a
	# series that wasn't found.
	error_page 404 @notfound;

	location /v1/tvdb/shows/en/ {
		try_files $uri.json =404;
	}

	location = /v1/tvdb/search/en/ {
		try_files /v1/tvdb/search/en/index.json =404;
	}

	location / {
		return 404;
	}

	location @notfound {
		return 404 '{"error":"Not found"}';
	}
}
