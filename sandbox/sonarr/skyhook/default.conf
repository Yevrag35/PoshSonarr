server {
	listen 443 ssl;
	server_name skyhook.sonarr.tv;

	ssl_certificate /etc/nginx/tls/cert.pem;
	ssl_certificate_key /etc/nginx/tls/key.pem;

	root /usr/share/nginx/html;
	default_type application/json;

	# Sonarr's HTTP client throws on an HTML response before it looks at the status, so nginx's own
	# 404 page would turn a show that isn't here into a 500. A JSON 404 is what Sonarr reports as a
	# series that wasn't found.
	error_page 404 @notfound;

	# Sonarr asks for a show in a language, by its three-letter code, and a season type, the numbering that the
	# episodes follow. Every fixture is in English with the official numbering, so any other language or season type
	# gets the JSON 404.
	location ~ ^/v2/tvdb/shows/eng/(?<tvdb_id>[0-9]+)/official$ {
		try_files /v2/tvdb/shows/eng/$tvdb_id.json =404;
	}

	# A search sends its language and term in the query string, which the mock ignores, so every search finds every
	# show.
	location = /v2/tvdb/search/ {
		try_files /v2/tvdb/search/index.json =404;
	}

	# Webhook notifications post here. Sonarr's test of a webhook passes when the webhook's URL answers with a success,
	# so every request to a path under /hooks/ gets a 200 and an empty JSON object, whatever its method. A webhook whose
	# URL is any other path on the mock gets the JSON 404, which fails its test.
	location /hooks/ {
		return 200 '{}';
	}

	location / {
		return 404;
	}

	location @notfound {
		return 404 '{"error":"Not found"}';
	}
}
